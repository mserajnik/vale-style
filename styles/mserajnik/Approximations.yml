---
extends: existence
message: "Write 'about' or 'around' instead of '%s'."
link: https://github.com/mserajnik/vale-style
level: error
nonword: true
# The tilde as an approximation marker ("~2023", "~186 files"). A path
# such as `~/Code` never matches, because a digit has to follow.
tokens:
  - '~\d+'
