StylesPath = styles
MinAlertLevel = suggestion
Vocab = mserajnik

Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/mserajnik/vale-ai-tells/releases/latest/download/ai-tells.zip

[*]
BasedOnStyles = Google, ai-tells, mserajnik

# Google recommends contractions; this style does not use them.
Google.Contractions = NO
# Google product word choices such as "tap" and "app", aimed at
# consumer documentation.
Google.WordListCase = NO
# Replaced by `mserajnik.OxfordComma`, whose guard also names `whether`.
Google.OxfordComma = NO
