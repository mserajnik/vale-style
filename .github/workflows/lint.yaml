name: Lint

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: kjanat/actionlint@v1

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run reuse lint
        uses: fsfe/reuse-action@v6

  vale:
    name: Vale
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Vale
        uses: vale-cli/vale-action@v3
        with:
          fail_level: any
          filter_mode: nofilter

  dprint:
    name: dprint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run dprint check
        uses: dprint/check@v2.5
